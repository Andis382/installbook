# Customer-facing WhatsApp messages. {placeholders} are filled by name; the text is sent as written.
msg.warranty_card=Hello {customer}, thank you for choosing {business}.\nYour warranty card:\n{unitLine}\nInstalled on {installed}, warranty until {warrantyUntil}.\nKeep this link. It holds your warranty and service history: {link}
msg.service_due=Hello {customer}, the {unit} we installed for you on {installed} is due for its regular service in {month}. A check keeps it safe and running efficiently.\nBook a time that suits you: {link}\nOr reply 1 and we will call you. Reply STOP and we will not send reminders again.\n{business}, {phone}
msg.service_overdue=Hello {customer}, the {unit} we installed for you on {installed} was due for its regular service in {month}. There is no rush, but a check keeps it safe and running efficiently.\nBook a time that suits you: {link}\nOr reply 1 and we will call you. Reply STOP and we will not send reminders again.\n{business}, {phone}
msg.booking_received=Thank you, {customer}. We have your request to service the {unit}{preferred}. {business} will call you to agree the time.
msg.booking_scheduled=Hello {customer}, your service visit is booked: {when}, at {address}. If that time does not suit you, call {business} on {phone}.\n{link}
msg.booking_declined=Hello {customer}, thank you for your request. {business} cannot take this booking at the moment{reason}. Please call {phone} and we will find another time.
msg.installer_digest=Good morning {name}. Your week at {business}: {overdue} overdue, {dueMonth} due this month, {newBookings} new booking requests.\n{list}\nDue list: {link}
msg.opt_out_confirmed=Done. {business} will not send you reminders on WhatsApp any more. If you change your mind, just tell us.

