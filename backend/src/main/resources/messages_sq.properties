# Mesazhet për klientët në WhatsApp.
msg.warranty_card=Përshëndetje {customer}, faleminderit që zgjodhët {business}.\nKarta juaj e garancisë:\n{unitLine}\nInstaluar më {installed}, me garanci deri më {warrantyUntil}.\nRuajeni këtë lidhje. Aty gjeni garancinë dhe historikun e servisit: {link}
msg.service_due=Përshëndetje {customer}, {unit} që ju instaluam më {installed} duhet servisuar në {month}. Një kontroll i rregullt e mban të sigurt dhe me konsum të ulët.\nZgjidhni një orar që ju përshtatet: {link}\nOse shkruani 1 dhe ju telefonojmë ne. Shkruani NDALO dhe nuk ju dërgojmë më kujtesa.\n{business}, {phone}
msg.service_overdue=Përshëndetje {customer}, {unit} që ju instaluam më {installed} duhej servisuar në {month}. Nuk është urgjente, por një kontroll e mban të sigurt dhe me konsum të ulët.\nZgjidhni një orar që ju përshtatet: {link}\nOse shkruani 1 dhe ju telefonojmë ne. Shkruani NDALO dhe nuk ju dërgojmë më kujtesa.\n{business}, {phone}
msg.booking_received=Faleminderit, {customer}. E morëm kërkesën tuaj për servis: {unit}{preferred}. {business} do t'ju telefonojë për të caktuar orarin.
msg.booking_scheduled=Përshëndetje {customer}, vizita për servis u caktua: {when}, në {address}. Nëse ky orar nuk ju përshtatet, telefononi {business} në {phone}.\n{link}
msg.booking_declined=Përshëndetje {customer}, faleminderit për kërkesën. {business} nuk mund ta marrë këtë rezervim tani{reason}. Ju lutemi telefononi në {phone} dhe gjejmë një orar tjetër.
msg.installer_digest=Mirëmëngjes {name}. Java juaj te {business}: {overdue} me vonesë, {dueMonth} për këtë muaj, {newBookings} kërkesa të reja për servis.\n{list}\nLista e afateve: {link}
msg.opt_out_confirmed=U krye. {business} nuk do t'ju dërgojë më kujtesa në WhatsApp. Nëse ndryshoni mendje, na e thoni.

